name: Build Desktop App

# Builds Windows (.exe), macOS (.dmg) and Linux (.AppImage) installers on their
# native OS runners and attaches them to a GitHub Release.
#
# Trigger by pushing a tag like `desktop-v1.0.0`, or run manually from the
# Actions tab (workflow_dispatch) to produce build artifacts without a release.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer (${{ matrix.target }})
        run: npm run dist:${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do NOT auto-publish here; we upload artifacts / release below so a
          # manual run never needs a tag.
          EP_DRAFT: "true"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mydraft-${{ matrix.target }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: ignore

      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
